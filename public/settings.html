<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Redio</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .settings-page {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary-color);
        }
        
        .settings-header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .settings-container {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .settings-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }
        
        .settings-tab {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        
        .settings-tab:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
        }
        
        .settings-tab.active {
            background: var(--primary-color);
            color: white;
        }
        
        .settings-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .settings-content.active {
            display: block;
        }
        
        .settings-section {
            margin-bottom: 40px;
        }
        
        .settings-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .setting-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .setting-card h3 {
            margin-bottom: 15px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .setting-item {
            margin-bottom: 20px;
        }
        
        .setting-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
        }
        
        .setting-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .setting-input, .setting-select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
        }
        
        .setting-input:focus, .setting-select:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .setting-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .setting-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .setting-checkbox label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }
        
        .setting-range {
            width: 100%;
            margin: 10px 0;
        }
        
        .setting-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .theme-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .theme-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .theme-option.active {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.1);
        }
        
        .theme-preview {
            width: 60px;
            height: 40px;
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .theme-preview.dark {
            background: #1e293b;
        }
        
        .theme-preview.light {
            background: #f8fafc;
        }
        
        .theme-preview.blue {
            background: #0f172a;
            border-color: #3b82f6;
        }
        
        .theme-preview.purple {
            background: #1e1b4b;
            border-color: #8b5cf6;
        }
        
        .theme-preview.green {
            background: #064e3b;
            border-color: #10b981;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .toggle-switch:checked {
            background: var(--primary-color);
        }
        
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: white;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }
        
        .toggle-switch:checked::after {
            left: 26px;
        }
        
        .proxy-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .proxy-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .proxy-option:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-color);
        }
        
        .proxy-option.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary-color);
        }
        
        .proxy-info {
            flex: 1;
        }
        
        .proxy-name {
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .proxy-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .proxy-speed {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }
        
        .proxy-speed.slow {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning-color);
        }
        
        .proxy-speed.fast {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }
        
        .search-engine-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .search-engine-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-engine-option:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-color);
        }
        
        .search-engine-option.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary-color);
        }
        
        .search-engine-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
